<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow Kanban</title>
    <!-- Esta página es interna (el dashboard), es correcto que NO se indexe en Google -->
    <meta name="robots" content="noindex, nofollow">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                500: '#8b5cf6',
                600: '#7c3aed',
              }
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/kanban.css" />
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-300">
    <!-- =====================================================================
       ZONA A — NAV / HEADER  (líneas ~20-45)
       Encargado: Dev Frontend 1
       Reglas: SOLO edita dentro de <header>...</header>.
  ====================================================================== -->
  <header id="app-header" class="p-4 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-brand-500 flex items-center justify-center text-white font-bold text-xl">T</div>
      <span class="font-bold text-lg">TaskFlow</span>
    </div>
    
    <div class="flex items-center gap-4">
      <!-- Botón Modo Oscuro -->
      <button id="theme-toggle" class="p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
          <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
          <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path></svg>
      </button>

      <div id="user-info" class="text-sm text-slate-500 dark:text-slate-400">
        <!-- 
          TUTORIAL JS: Aquí inyectaremos el nombre del usuario logueado 
        -->
      </div>
      <span id="logout-button" class="cursor-pointer text-sm text-red-500 hover:text-red-600 font-medium">Cerrar sesión</span>
    </div>
  </header>
  <!-- ===================== FIN ZONA A ===================== -->
   

    <!-- =====================================================================
       ZONA B — TABLERO KANBAN (columnas y tarjetas)  (líneas ~50-90)
       Encargado: Dev Frontend 2
       Reglas: SOLO edita dentro de <main>...</main>.
  ====================================================================== -->
    <main id="kanban-board" class="grid grid-cols-1 md:grid-cols-3 gap-4 p-6">
      <section class="column" data-status="por_hacer">
        <h2 class="font-semibold mb-2">Por Hacer</h2>
        <div class="task-list" id="list-por_hacer">
          <!-- tarjetas generadas por kanban.js -->
        </div>
      </section>

      <section class="column" data-status="en_progreso">
        <h2 class="font-semibold mb-2">En Progreso</h2>
        <div class="task-list" id="list-en_progreso"></div>
      </section>

      <section class="column" data-status="terminado">
        <h2 class="font-semibold mb-2">Terminado</h2>
        <div class="task-list" id="list-terminado"></div>
      </section>
    </main>
    <!-- ===================== FIN ZONA B ===================== -->

    <!-- =====================================================================
       ZONA C — MODAL DE CREAR/EDITAR TAREA
       Encargado: quien termine primero entre Dev 1 y Dev 2 (avisar en el grupo)
  ====================================================================== -->
    <div
      id="task-modal"
      class="hidden fixed inset-0 bg-black/50 items-center justify-center"
    >
      <!-- formulario de tarea aquí -->
    </div>
    <!-- ===================== FIN ZONA C ===================== -->

    <!-- =====================================================================
       ZONA D — FOOTER (opcional, baja prioridad)
  ====================================================================== -->
    <footer class="p-4 text-center text-xs text-[#94A3B8]"></footer>
    <!-- ===================== FIN ZONA D ===================== -->

    <script src="js/app.js"></script>
    <script src="js/kanban.js"></script>
  </body>
</html>
