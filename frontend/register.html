<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Registrarse | TaskFlow Kanban</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                500: '#8b5cf6',
                600: '#7c3aed',
                700: '#6d28d9',
              }
            }
          }
        }
      }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <!-- 
      =====================================================================
      TUTORIAL PARA EL EQUIPO: PÁGINA DE REGISTRO
      =====================================================================
      1. Diseñada para recoger Nombre, Correo y Contraseña.
      2. Agreguen validaciones en JS (ej. la contraseña debe tener 8 caracteres).
      3. Por ahora, el botón hace un onsubmit preventDefault y simula entrar a index.html.
    -->

    <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-xl overflow-hidden border border-slate-200 dark:border-slate-700">
        <div class="p-8">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-brand-500 text-white font-bold text-2xl mb-4">
                    T
                </div>
                <h2 class="text-2xl font-bold">Crea tu cuenta</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">Únete a TaskFlow y organiza tu vida</p>
            </div>

            <!-- Formulario -->
            <form id="register-form" class="space-y-5" onsubmit="event.preventDefault(); window.location.href='index.html';">
                
                <!-- Nombre -->
                <div>
                    <label for="name" class="block text-sm font-medium mb-1">Nombre Completo</label>
                    <input type="text" id="name" required placeholder="Juan Pérez"
                           class="w-full px-4 py-3 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition-all">
                </div>

                <!-- Correo Electrónico -->
                <div>
                    <label for="email" class="block text-sm font-medium mb-1">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="tu@ejemplo.com"
                           class="w-full px-4 py-3 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition-all">
                </div>

                <!-- Contraseña -->
                <div>
                    <label for="password" class="block text-sm font-medium mb-1">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••" minlength="6"
                           class="w-full px-4 py-3 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition-all">
                    
                    <!-- 
                      ESPACIO PARA LÓGICA DE VALIDACIÓN (JS)
                      Añadan aquí una barrita de seguridad de la contraseña si quieren.
                    -->
                </div>

                <!-- Botón Submit -->
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors shadow-lg shadow-brand-500/30 mt-6">
                    Crear Cuenta
                </button>
            </form>

            <div class="mt-8 text-center text-sm text-slate-500 dark:text-slate-400">
                ¿Ya tienes una cuenta? 
                <a href="login.html" class="font-semibold text-brand-600 dark:text-brand-400 hover:underline">Inicia Sesión</a>
            </div>
        </div>
        
        <!-- Volver al Inicio -->
        <div class="bg-slate-50 dark:bg-slate-900/50 p-4 border-t border-slate-200 dark:border-slate-700 text-center">
            <a href="landingPage.html" class="text-sm font-medium text-slate-500 hover:text-slate-800 dark:hover:text-slate-300">
                &larr; Volver a la página principal
            </a>
        </div>
    </div>

    <!-- Script rápido para tema oscuro -->
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</body>
</html>
